name: build-huanji
on:
  workflow_dispatch:
  push:
    branches: [huanji2]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: huanji2
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build release
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace 2>&1 | tee /tmp/build.log
      - name: Report error log
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYEOF'
          import re, base64, json, urllib.request, os
          log = open('/tmp/build.log', encoding='utf-8', errors='replace').read()
          lines = log.splitlines()
          errs = [l for l in lines if re.search(r'e:|error|FAILED|Execution failed|What went wrong|Caused by', l, re.I)][:60]
          tail = lines[-25:]
          body = 'ERR:\n' + '\n'.join(errs)[:3000] + '\nTAIL:\n' + '\n'.join(tail)[:3000]
          repo = '${{ github.repository }}'
          tok = os.environ['GH_TOKEN']
          def api(path, data=None, method='GET'):
              req = urllib.request.Request('https://api.github.com' + path, data=json.dumps(data).encode() if data else None, headers={'Authorization': 'Bearer ' + tok, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}, method=method)
              return json.load(urllib.request.urlopen(req))
          try:
              cur = api('/repos/' + repo + '/contents/build-error.txt?ref=huanji2')
              sha = cur.get('sha')
          except Exception:
              sha = None
          payload = {'message': 'huanji2 build error log', 'content': base64.b64encode(body.encode()).decode(), 'branch': 'huanji2'}
          if sha: payload['sha'] = sha
          api('/repos/' + repo + '/contents/build-error.txt', payload, 'PUT')
          PYEOF
      - name: Sign with fixed key
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_STORE_PASS: ${{ secrets.SIGNING_STORE_PASS }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASS: ${{ secrets.SIGNING_KEY_PASS }}
        run: |
          set -e
          echo "$SIGNING_KEYSTORE_B64" | base64 -d > /tmp/huanji.jks
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED=app/build/outputs/apk/release/app-release-aligned.apk
          SIGNED=app/build/outputs/apk/release/huanji-release-signed.apk
          ls -la app/build/outputs/apk/release/
          "$BT/zipalign" -f 4 "$UNSIGNED" "$ALIGNED"
          "$BT/apksigner" sign --ks /tmp/huanji.jks --ks-pass:env SIGNING_STORE_PASS --key-pass:env SIGNING_KEY_PASS --ks-key-alias "$SIGNING_KEY_ALIAS" --out "$SIGNED" "$ALIGNED"
          rm -f /tmp/huanji.jks
          "$BT/apksigner" verify --print-certs "$SIGNED" | head -5
      - uses: actions/upload-artifact@v4
        with:
          name: huanji-apk
          path: app/build/outputs/apk/release/huanji-release-signed.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.1-huanji2
          name: å¹»æº v2.0.1-huanji2
          files: app/build/outputs/apk/release/huanji-release-signed.apk
