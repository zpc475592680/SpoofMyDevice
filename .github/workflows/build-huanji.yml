name: build-huanji
on:
  workflow_dispatch:
  push:
    branches: [huanji2]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: huanji2
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build release
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace 2>&1 | tee /tmp/build.log
      - name: Sign with fixed key
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_STORE_PASS: ${{ secrets.SIGNING_STORE_PASS }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASS: ${{ secrets.SIGNING_KEY_PASS }}
        run: |
          set -o pipefail
          set -ex
          {
          echo "$SIGNING_KEYSTORE_B64" | base64 -d > /tmp/huanji.jks
          ls -la /tmp/huanji.jks
          printf '%s' "$SIGNING_STORE_PASS" > /tmp/ks.pass
          printf '%s' "$SIGNING_KEY_PASS" > /tmp/kp.pass
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          echo "BT=$BT"
          ls -la app/build/outputs/apk/release/
          UNSIGNED=$(ls app/build/outputs/apk/release/*unsigned*.apk 2>/dev/null | head -1)
          if [ -z "$UNSIGNED" ]; then UNSIGNED=$(ls app/build/outputs/apk/release/*.apk | head -1); fi
          echo "UNSIGNED=$UNSIGNED"
          ALIGNED=app/build/outputs/apk/release/app-release-aligned.apk
          SIGNED=app/build/outputs/apk/release/huanji-release-signed.apk
          "$BT/zipalign" -f 4 "$UNSIGNED" "$ALIGNED"
          "$BT/apksigner" sign --ks /tmp/huanji.jks --ks-pass:file /tmp/ks.pass --key-pass:file /tmp/kp.pass --ks-key-alias "$SIGNING_KEY_ALIAS" --out "$SIGNED" "$ALIGNED"
          rm -f /tmp/huanji.jks /tmp/ks.pass /tmp/kp.pass
          "$BT/apksigner" verify --print-certs "$SIGNED" | head -5
          } 2>&1 | tee -a /tmp/build.log
      - uses: actions/upload-artifact@v4
        with:
          name: huanji-apk
          path: app/build/outputs/apk/release/huanji-release-signed.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.1-huanji2
          name: 幻机 v2.0.1-huanji2
          files: app/build/outputs/apk/release/huanji-release-signed.apk
      - name: Report error log
        if: failure()
        run: |
          grep -aE "e: |error:|FAILED|Execution failed|What went wrong|Caused by|Exception" /tmp/build.log | head -c 6000 > build-error.txt || true
          echo '---TAIL---' >> build-error.txt
          tail -c 2500 /tmp/build.log >> build-error.txt || true
          git config user.email "bot@local"
          git config user.name "huanji-bot"
          git add -f build-error.txt
          git commit -m "huanji2 build error log" || true
          git push origin HEAD:huanji2 || true
